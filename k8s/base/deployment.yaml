apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquid-biopsy-api
  labels:
    app.kubernetes.io/name: liquid-biopsy-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: liquid-biopsy-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # zero-downtime: the new pod must be ready before the old one stops
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: liquid-biopsy-api
    spec:
      serviceAccountName: liquid-biopsy-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: liquid-biopsy-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: liquid-biopsy-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: liquid-biopsy-secrets
                  key: database-url
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: liquid-biopsy-secrets
                  key: appinsights-connection-string
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:          # model loading + DB migrations can take a while on first start
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
