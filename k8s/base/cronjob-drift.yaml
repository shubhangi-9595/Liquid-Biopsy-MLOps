# Daily drift check: compares the last 7 days of inputs with the training data.
# Run it now:  kubectl -n liquid-biopsy create job --from=cronjob/liquid-biopsy-drift drift-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: liquid-biopsy-drift
  labels:
    app.kubernetes.io/name: liquid-biopsy-drift
spec:
  schedule: "0 6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: liquid-biopsy-drift
        spec:
          restartPolicy: Never
          serviceAccountName: liquid-biopsy-api
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drift
              image: liquid-biopsy-api
              command: ["python", "-m", "app.drift"]
              envFrom:
                - configMapRef:
                    name: liquid-biopsy-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: liquid-biopsy-secrets
                      key: database-url
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
