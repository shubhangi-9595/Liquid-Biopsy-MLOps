# TEST-ONLY credentials for the throwaway Postgres inside a local/CI kind cluster.
# Never used in Azure: there, secrets come from Azure Key Vault (see overlays/aks).
apiVersion: v1
kind: Secret
metadata:
  name: liquid-biopsy-secrets
type: Opaque
stringData:
  database-url: postgresql://liquidbiopsy:local-test-only@postgres:5432/liquidbiopsy
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: liquidbiopsy
  POSTGRES_PASSWORD: local-test-only
  POSTGRES_DB: liquidbiopsy
