# Run the API with the Azure workload identity and mount the Key Vault secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liquid-biopsy-api
  annotations:
    azure.workload.identity/client-id: from-azure-env
automountServiceAccountToken: true   # workload identity exchanges this token for an Azure token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquid-biopsy-api
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      containers:
        - name: api
          volumeMounts:
            - name: keyvault
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: liquid-biopsy-keyvault
