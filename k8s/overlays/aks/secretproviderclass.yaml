# Pulls secrets from Azure Key Vault using the pod's workload identity, mounts them as
# files AND syncs them into the Kubernetes Secret "liquid-biopsy-secrets" used by the
# Deployment/CronJob env vars. The placeholder values are filled from azure.env.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: liquid-biopsy-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: from-azure-env
    keyvaultName: from-azure-env
    tenantId: from-azure-env
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
  secretObjects:
    - secretName: liquid-biopsy-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: database-url
        - objectName: appinsights-connection-string
          key: appinsights-connection-string
