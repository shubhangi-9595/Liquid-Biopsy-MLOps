# Environment for the Azure ML training job: same pinned versions as requirements-train.txt
name: liquid-biopsy-train
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - scikit-learn==1.9.1
      - imbalanced-learn==0.14.2
      - pandas==3.0.5
      - numpy==2.5.3
      - joblib==1.6.0
      - matplotlib==3.11.2
      - PyYAML==6.0.3
      - mlflow-skinny==3.17.1
      - azureml-mlflow==1.60.0
